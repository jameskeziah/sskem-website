name: Temporary trusted dependency lock synchronization
on:
  push:
    branches:
      - release/complete-homepage-approval-gated-20261001
permissions:
  contents: write
jobs:
  sync-lock:
    if: github.repository == 'jameskeziah/sskem-website' && github.ref_name == 'release/complete-homepage-approval-gated-20261001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/complete-homepage-approval-gated-20261001
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile patch-version security upgrades
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile, if changed
        shell: bash
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='SSKEMS Security CI' -c user.email='ci@users.noreply.github.com' commit -m 'chore(security): lock patched runtime dependencies'
            git push origin HEAD:release/complete-homepage-approval-gated-20261001
          fi
