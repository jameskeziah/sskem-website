name: SSKEMS homepage release-candidate checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [release/complete-homepage-approval-gated-20261001]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-build-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HOMEPAGE_REVIEW_MODE: private
      HOMEPAGE_ZENTRY_HERO: preview
      HOMEPAGE_PUBLIC_ZENTRY_HERO: "false"
    steps:
      - name: Checkout candidate without private photo assets
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate shared tokens
        run: npm run tokens:build
      - name: ESLint
        run: npm run lint
      - name: Unit and publication regression tests
        run: npm run test:hero && npm run test:contract
      - name: Verify inactive public-photo gate
        run: node --experimental-strip-types scripts/audit-home-zentry-publication.mjs
      - name: Vercel-compatible private review build
        run: npm run build:vercel
      - name: Ensure private photo drafts were not tracked
        shell: bash
        run: |
          if git ls-files | grep -E '^(public/media/home/hero-drafts/|sskem-hero-media/|sskem-zentry-hero-assets\\.zip)' ; then
            echo 'Private photo assets are included in Git.' >&2
            exit 1
          fi
