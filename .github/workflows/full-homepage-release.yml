name: SSKEMS full homepage release validation

on:
  pull_request:
    branches:
      - main
      - feature/home-campus-hybrid
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out proposed release
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Poppler for actual document-ingestion contract tests
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Generate design tokens
        run: npm run tokens:build
      - name: Lint full source
        run: npm run lint
      - name: Report existing full-repository TypeScript baseline (separate merge blocker)
        continue-on-error: true
        run: |
          npx tsc --noEmit --incremental false
          echo 'Global TypeScript debt must be resolved separately before public release.'
      - name: Validate hero scene contracts and publication safety
        run: npm run test:hero
      - name: Run motion-contract tests
        run: node --experimental-strip-types --test tests/motion-system.test.mjs
      - name: Run current-framework repository contract suite
        run: npm run test:release-contract
      - name: Audit hero publication (no bypass)
        run: npm run hero:publication:audit
      - name: Build access-controlled review edition (no photo publishing)
        env:
          HOMEPAGE_REVIEW_MODE: private
          HOMEPAGE_ZENTRY_HERO: preview
          HOMEPAGE_PUBLIC_ZENTRY_HERO: 'false'
        run: npm run build:vercel
      - name: Identify and block high-risk production dependency vulnerabilities
        shell: bash
        run: |
          npm audit --omit=dev --json > production-audit.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("production-audit.json", "utf8"));
          for (const [name, v] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name, severity: v.severity, range: v.range,
              via: (v.via ?? []).map(item => typeof item === "string" ? item : { title: item.title, url: item.url }),
              fixAvailable: v.fixAvailable
            }));
          }
          const summary = report.metadata?.vulnerabilities ?? {};
          console.log("Production dependency vulnerabilities:", JSON.stringify(summary));
          if ((summary.high ?? 0) + (summary.critical ?? 0) > 0 || report.error) {
            console.error("High or critical production dependency issues must be resolved before releasing.");
            process.exitCode = 1;
          }
          NODE
